name: Build APK DARIMMO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Decompresser le projet
        run: |
          unzip -q projet.zip -d app
          P=$(find app -maxdepth 2 -name package.json -not -path '*/node_modules/*' | head -1)
          echo "APPDIR=$(dirname "$P")" >> $GITHUB_ENV
      - name: Construire le site
        working-directory: ${{ env.APPDIR }}
        run: |
          npm install
          npm run build
      - name: Transformer en appli Android
        working-directory: ${{ env.APPDIR }}
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ne.darimmo.app",
            "appName": "DARIMMO",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Compiler l'APK
        working-directory: ${{ env.APPDIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Signer l'APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/darimmo.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find "${{ env.APPDIR }}/android/app/build/outputs/apk/release" -name "*.apk" | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/darimmo.jks" --ks-key-alias darimmo --ks-pass env:KS_PASS --key-pass env:KS_PASS --out DARIMMO.apk aligned.apk
          "$BT/apksigner" verify DARIMMO.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DARIMMO v${{ github.run_number }}
          files: DARIMMO.apk
